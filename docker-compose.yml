services:
  ebpf-detector:
    build:
      context: .
      target: detector
    privileged: true
    pid: host
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    environment:
      SIMULATOR_URL: http://simulator:8081
      LOG_EVENTS: "${LOG_EVENTS:-0}"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - ./logs:/app/logs
    networks:
      - dashboard
      - simulation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/health', timeout=2).close()"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  simulator:
    build:
      context: .
      target: simulator
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,mode=1777,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 48
    networks:
      - simulation
    restart: unless-stopped

networks:
  dashboard: {}
  simulation:
    internal: true
